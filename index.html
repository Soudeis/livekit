<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>LiveKit Test</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
    h2 { margin-bottom: 16px; }
    input, textarea { background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 8px; width: 100%; margin-bottom: 10px; }
    button { padding: 10px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 8px; }
    #join { background: #2563eb; color: #fff; }
    #leave { background: #dc2626; color: #fff; }
    #status { margin: 12px 0; color: #aaa; font-size: 13px; }
    #videos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    video { width: 320px; height: 240px; border-radius: 8px; background: #222; object-fit: cover; }
    .label { font-size: 11px; color: #aaa; text-align: center; margin-top: 4px; }
    .video-wrap { display: flex; flex-direction: column; }
  </style>
</head>
<body>
  <h2>🎥 LiveKit Test</h2>

  <label>URL du serveur</label>
  <input id="url" value="wss://monlivekit.duckdns.org" />

  <label>Token</label>
  <textarea id="token" rows="3" placeholder="Colle ton token ici"></textarea>

  <button id="join">Rejoindre</button>
  <button id="leave">Quitter</button>

  <p id="status">⚪ Non connecté</p>
  <div id="videos"></div>

  <script>
    const { Room, RoomEvent, Track, createLocalTracks } = LivekitClient;
    let room;

    function addVideo(track, identity) {
      const wrap = document.createElement('div');
      wrap.className = 'video-wrap';
      wrap.id = 'wrap-' + identity;
      const el = track.attach();
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = identity;
      wrap.appendChild(el);
      wrap.appendChild(label);
      document.getElementById('videos').appendChild(wrap);
    }

    document.getElementById('join').onclick = async () => {
      const url = document.getElementById('url').value.trim();
      const token = document.getElementById('token').value.trim();
      const status = document.getElementById('status');

      if (!token) { alert('Colle un token !'); return; }

      room = new Room();

      room.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
        if (track.kind === Track.Kind.Video) {
          addVideo(track, participant.identity);
        }
        if (track.kind === Track.Kind.Audio) {
          const el = track.attach();
          document.body.appendChild(el);
        }
      });

      room.on(RoomEvent.TrackUnsubscribed, (track, pub, participant) => {
        track.detach();
        const wrap = document.getElementById('wrap-' + participant.identity);
        if (wrap) wrap.remove();
      });

      room.on(RoomEvent.Connected, () => {
        status.textContent = '🟢 Connecté — ' + room.localParticipant.identity;
      });

      room.on(RoomEvent.Disconnected, () => {
        status.textContent = '⚪ Déconnecté';
      });

      try {
        await room.connect(url, token);

        const tracks = await createLocalTracks({ audio: true, video: true });
        for (const track of tracks) {
          await room.localParticipant.publishTrack(track);
          if (track.kind === Track.Kind.Video) {
            addVideo(track, room.localParticipant.identity + ' (moi)');
          }
        }
      } catch (e) {
        status.textContent = '🔴 Erreur : ' + e.message;
        console.error(e);
      }
    };

    document.getElementById('leave').onclick = async () => {
      if (room) {
        await room.disconnect();
        document.getElementById('videos').innerHTML = '';
      }
    };
  </script>
</body>
</html>
