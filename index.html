<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveKit Call</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* ── ÉCRAN ACCUEIL ── */
    #connect-screen {
      position: absolute; inset: 0; background: #111;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; z-index: 100; padding: 32px;
    }
    #connect-screen h1 { color: #fff; font-size: 26px; font-weight: 700; margin-bottom: 4px; }
    #connect-screen input,
    #connect-screen textarea {
      width: 100%; max-width: 420px;
      background: #1c1c1e; border: 1px solid #3a3a3c;
      border-radius: 12px; color: #fff;
      padding: 14px 16px; font-size: 15px; outline: none;
    }
    #connect-screen textarea { height: 88px; resize: none; }

    .call-type {
      display: flex; gap: 10px; width: 100%; max-width: 420px;
    }
    .call-type-btn {
      flex: 1; padding: 14px 8px;
      border-radius: 14px; border: 2px solid #3a3a3c;
      background: #1c1c1e; color: #fff;
      font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: center;
      transition: all 0.2s;
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
    }
    .call-type-btn .icon { font-size: 26px; }
    .call-type-btn.selected { border-color: #25d366; background: #0d2e1a; }
    .call-type-btn:active { transform: scale(0.97); }

    #btn-join {
      width: 100%; max-width: 420px;
      background: #25d366; color: #fff; border: none;
      border-radius: 14px; padding: 16px;
      font-size: 17px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s; opacity: 0.4;
      pointer-events: none;
    }
    #btn-join.ready { opacity: 1; pointer-events: all; }
    #btn-join:active { opacity: 0.8; }
    #connect-screen .hint { color: #555; font-size: 13px; text-align: center; }

    /* ── VUE APPEL ── */
    .video-slot {
      position: absolute; overflow: hidden;
      transition: all 0.35s cubic-bezier(.4,0,.2,1);
    }
    .video-slot video { width: 100%; height: 100%; object-fit: cover; }

    .slot-main { inset: 0; border-radius: 0; z-index: 5; }
    .slot-pip {
      bottom: 140px; right: 16px;
      width: 110px; height: 160px;
      border-radius: 18px; z-index: 20;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .slot-pip:hover { border-color: rgba(255,255,255,0.45); }

    /* En mode partage écran : video en letterbox */
    .slot-main.screen-mode video { object-fit: contain; background: #000; }

    .local-video { transform: scaleX(-1); }
    .screen-video { transform: none !important; }

    /* Fond appel audio */
    #audio-bg {
      position: absolute; inset: 0;
      background: linear-gradient(160deg, #0d1b2a 0%, #1a1a2e 100%);
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; z-index: 4;
    }
    #audio-bg .audio-avatar {
      width: 110px; height: 110px; border-radius: 50%;
      background: #2a2a3e;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      box-shadow: 0 0 0 12px rgba(37,211,102,0.1), 0 0 0 24px rgba(37,211,102,0.05);
    }
    #audio-bg .audio-name { color: #fff; font-size: 22px; font-weight: 600; }
    #audio-bg .audio-status { color: rgba(255,255,255,0.5); font-size: 14px; }

    .wave {
      display: flex; gap: 5px; align-items: center; height: 30px;
    }
    .wave span {
      display: block; width: 4px; border-radius: 2px;
      background: #25d366; animation: wave 1.2s ease-in-out infinite;
    }
    .wave span:nth-child(1) { animation-delay: 0s; }
    .wave span:nth-child(2) { animation-delay: 0.15s; }
    .wave span:nth-child(3) { animation-delay: 0.3s; }
    .wave span:nth-child(4) { animation-delay: 0.45s; }
    .wave span:nth-child(5) { animation-delay: 0.6s; }
    @keyframes wave {
      0%, 100% { height: 6px; }
      50% { height: 24px; }
    }

    .no-video-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; background: #1a1a1a; color: #555;
    }
    .avatar-circle {
      width: 90px; height: 90px; border-radius: 50%;
      background: #2a2a2a;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
    }
